name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: itroot
          MYSQL_DATABASE: btry_it
          MYSQL_USER: btry
          MYSQL_PASSWORD: btrypass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IT_DB_URL: jdbc:mysql://127.0.0.1:3306/btry_it?allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
      IT_DB_USER: btry
      IT_DB_PASSWORD: btrypass
      IT_REDIS_HOST: 127.0.0.1
      IT_REDIS_PORT: 6379
      IT_REDIS_DATABASE: 15
      COS_SECRET_ID: ci-dummy
      COS_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests
        run: mvn -B test
      - name: Backend integration tests
        run: mvn -B -Pintegration test
      - name: Package backend
        run: mvn -B -DskipTests package
      - name: JaCoCo coverage report
        run: mvn -B -q jacoco:report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: ci-dummy
      MYSQL_ROOT_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v5
      - name: Build backend and web images
        run: docker compose build