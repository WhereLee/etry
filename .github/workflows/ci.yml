name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml

      # 现有测试都是纯单元测试（不启动 Spring 上下文），
      # 所以这里不需要起 MySQL / Redis 服务容器。
      # 以后加 @SpringBootTest 时，再补 services 段。
      - name: Build and test
        working-directory: server
        run: mvn -B -ntp verify
