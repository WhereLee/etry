name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: itroot
          MYSQL_DATABASE: btry_it
          MYSQL_USER: btry
          MYSQL_PASSWORD: btrypass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IT_DB_URL: jdbc:mysql://127.0.0.1:3306/btry_it?allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
      IT_DB_USER: btry
      IT_DB_PASSWORD: btrypass
      IT_REDIS_HOST: 127.0.0.1
      IT_REDIS_PORT: 6379
      IT_REDIS_DATABASE: 15
      COS_SECRET_ID: ci-dummy
      COS_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests
        run: mvn -B test
      - name: Backend integration tests
        run: mvn -B -Pintegration test
      - name: Package backend
        run: mvn -B -DskipTests package
      - name: JaCoCo coverage report
        run: mvn -B -q jacoco:report
      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: server/target/site/jacoco
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  # google/osv-scanner-action@v2 is not runnable: there is no v2 tag/branch and
  # its root action.yml has no runs block. The v2 CLI also lacks --min-severity.
  # Use the OSV API scripts with a fail-closed HIGH/CRITICAL gate instead.
  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Generate Maven dependency list
        working-directory: server
        run: mvn -B -ntp -DskipTests dependency:list -DoutputFile=dependency-list.txt
      - name: OSV scan and HIGH/CRITICAL gate
        env:
          OSV_OUT: ${{ runner.temp }}/osv
        run: |
          set -euo pipefail
          mkdir -p "$OSV_OUT"
          python3 tools/osv-scan.py maven server/dependency-list.txt > "$OSV_OUT/backend-osv.json"
          python3 tools/osv-details.py "$OSV_OUT/backend-osv.json" "$OSV_OUT/backend-osv-details.json"
          python3 tools/osv-gate.py "$OSV_OUT/backend-osv.json" "$OSV_OUT/backend-osv-details.json" osv-scanner.toml
      - name: Upload OSV scan evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: osv-scan-evidence
          path: ${{ runner.temp }}/osv/*
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: ci-dummy
      MYSQL_ROOT_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy
      RABBITMQ_PASSWORD: ci-dummy
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose and deploy scripts
        run: |
          docker compose config -q
          bash -n deploy/btry-backup.sh
          bash -n deploy/setup-server.sh
      - name: Build backend and web images
        run: docker compose build