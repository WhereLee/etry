spring:
  datasource:
    url: ${ETRY_DB_URL:jdbc:mysql://127.0.0.1:3306/etry_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${ETRY_DB_USER:root}
    password: ${ETRY_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${ETRY_REDIS_HOST:127.0.0.1}
      port: ${ETRY_REDIS_PORT:6379}
  servlet:
    multipart:
      enabled: true
      max-file-size: 60MB
      max-request-size: 60MB

etry:
  storage:
    type: local
    local:
      root: target/test-storage
      base-url: http://127.0.0.1:8080/local-storage
  mail:
    type: captured
  cache:
    type: memory
  schedule:
    pending-cleanup-cron: "-"
    trash-cleanup-cron: "-"
    reconcile-cron: "-"

logging:
  level:
    com.wherelee.etry: DEBUG
