<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - etry</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <form class="auth-card" id="registerForm">
        <h1>注册 etry</h1>
        <p class="hint">注册后需要收取邮件验证码才能登录</p>
        <div class="field">
            <label>邮箱</label>
            <input type="email" id="email" required autocomplete="username" placeholder="you@example.com">
        </div>
        <div class="field">
            <label>昵称</label>
            <input type="text" id="nickname" required maxlength="20" placeholder="2-20 个字符">
        </div>
        <div class="field">
            <label>密码</label>
            <input type="password" id="password" required autocomplete="new-password" placeholder="至少 8 位，含字母和数字">
        </div>
        <button class="block" type="submit" id="submitBtn">注册</button>
        <div class="msg" id="msg"></div>
        <div class="row" style="margin-top:16px">
            <span class="muted">已有账号？</span><a th:href="@{/login}">去登录</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const msg = document.getElementById('msg');
        const button = document.getElementById('submitBtn');
        const email = document.getElementById('email').value.trim();
        button.disabled = true;
        try {
            const result = await api('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify({
                    email,
                    nickname: document.getElementById('nickname').value.trim(),
                    password: document.getElementById('password').value
                })
            });
            // 邮箱验证开关关闭时账号直接生效，不用去验证页
            if (result && result.needVerify === false) {
                window.location.href = '/login?registered=1';
            } else {
                window.location.href = '/verify?email=' + encodeURIComponent(email);
            }
        } catch (error) {
            showMessage(msg, error.message);
            button.disabled = false;
        }
    });
</script>
</body>
</html>
