<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 - etry</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <form class="auth-card" id="resetForm">
        <h1>重置密码</h1>
        <p class="hint">把邮件里的验证码和新密码填进来。重置后其它设备上的登录会全部失效。</p>
        <div class="field">
            <label>邮箱</label>
            <input type="email" id="email" required>
        </div>
        <div class="field">
            <label>6 位验证码</label>
            <input type="text" id="code" required maxlength="6" inputmode="numeric" placeholder="123456">
        </div>
        <div class="field">
            <label>新密码</label>
            <input type="password" id="newPassword" required autocomplete="new-password" placeholder="至少 8 位，含字母和数字">
        </div>
        <button class="block" type="submit" id="submitBtn">重置密码</button>
        <div class="msg" id="msg"></div>
        <div class="row between" style="margin-top:16px">
            <a th:href="@{/forgot}">重新获取验证码</a>
            <a th:href="@{/login}">返回登录</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    const emailInput = document.getElementById('email');
    emailInput.value = new URLSearchParams(location.search).get('email') || '';

    document.getElementById('resetForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const msg = document.getElementById('msg');
        const button = document.getElementById('submitBtn');
        button.disabled = true;
        try {
            await api('/api/auth/password/reset', {
                method: 'POST',
                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    code: document.getElementById('code').value.trim(),
                    newPassword: document.getElementById('newPassword').value
                })
            });
            showMessage(msg, '密码已重置，正在跳转登录…', false);
            setTimeout(() => window.location.href = '/login', 900);
        } catch (error) {
            showMessage(msg, error.message);
            button.disabled = false;
        }
    });
</script>
</body>
</html>
