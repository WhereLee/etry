<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>验证邮箱 - etry</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <form class="auth-card" id="verifyForm">
        <h1>验证邮箱</h1>
        <p class="hint">验证码已发送到 <strong id="emailLabel"></strong>，15 分钟内有效</p>
        <div class="field">
            <label>6 位验证码</label>
            <input type="text" id="code" required maxlength="6" inputmode="numeric" placeholder="123456">
        </div>
        <button class="block" type="submit" id="submitBtn">完成验证</button>
        <div class="msg" id="msg"></div>
        <div class="row between" style="margin-top:16px">
            <button class="ghost small" type="button" id="resendBtn">重新发送</button>
            <a th:href="@{/login}">返回登录</a>
        </div>
    </form>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    const email = new URLSearchParams(location.search).get('email') || '';
    document.getElementById('emailLabel').textContent = email || '你的邮箱';

    document.getElementById('verifyForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const msg = document.getElementById('msg');
        const button = document.getElementById('submitBtn');
        button.disabled = true;
        try {
            await api('/api/auth/verify-email', {
                method: 'POST',
                body: JSON.stringify({email, code: document.getElementById('code').value.trim()})
            });
            showMessage(msg, '验证成功，正在跳转登录…', false);
            setTimeout(() => window.location.href = '/login', 800);
        } catch (error) {
            showMessage(msg, error.message);
            button.disabled = false;
        }
    });

    const resendBtn = document.getElementById('resendBtn');
    let countdown = 0;
    let timer = null;
    function startCooldown(seconds) {
        countdown = seconds;
        resendBtn.disabled = true;
        resendBtn.textContent = countdown + ' 秒后可重发';
        timer = setInterval(() => {
            countdown -= 1;
            if (countdown <= 0) {
                clearInterval(timer);
                resendBtn.disabled = false;
                resendBtn.textContent = '重新发送';
            } else {
                resendBtn.textContent = countdown + ' 秒后可重发';
            }
        }, 1000);
    }

    resendBtn.addEventListener('click', async () => {
        const msg = document.getElementById('msg');
        try {
            await api('/api/auth/verify-email/resend', {
                method: 'POST',
                body: JSON.stringify({email})
            });
            showMessage(msg, '验证码已重新发送', false);
            startCooldown(60);
        } catch (error) {
            showMessage(msg, error.message);
        }
    });
</script>
</body>
</html>
