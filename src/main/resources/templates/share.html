<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件分享 - etry</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>文件分享</h1>
        <div th:if="${invalid}">
            <p class="hint" th:text="${message}">分享已失效</p>
            <a th:href="@{/login}">去登录 etry</a>
        </div>
        <div th:unless="${invalid}">
            <p class="hint">
                <strong th:text="${fileName}">文件名</strong><br>
                <span th:text="${#numbers.formatDecimal(sizeBytes / 1024.0, 1, 1)} + ' KB'">大小</span>
                <span class="muted" th:text="'· 有效期至 ' + ${#temporals.format(expiresAt, 'yyyy-MM-dd HH:mm')}"></span>
            </p>
            <div class="field" th:if="${needCode}">
                <label>提取码</label>
                <input type="text" id="code" maxlength="4" inputmode="numeric" placeholder="4 位数字">
            </div>
            <button class="block" type="button" id="downloadBtn">下载</button>
            <div class="msg" id="msg"></div>
            <p class="muted" style="font-size:12px;margin-top:16px">
                链接一旦被复制，分享者无法阻止他人继续下载。
            </p>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    const token = /*[[${token}]]*/ '';
    const needCode = /*[[${needCode}]]*/ false;

    const button = document.getElementById('downloadBtn');
    if (button) {
        button.addEventListener('click', async () => {
            const msg = document.getElementById('msg');
            button.disabled = true;
            try {
                const codeInput = document.getElementById('code');
                const data = await api('/s/' + token + '/unlock', {
                    method: 'POST',
                    body: JSON.stringify({code: needCode && codeInput ? codeInput.value.trim() : null})
                });
                showMessage(msg, '已开始下载，如果没有反应请检查浏览器的下载拦截设置', false);
                window.location.href = data.url;
            } catch (error) {
                showMessage(msg, error.message);
            } finally {
                button.disabled = false;
            }
        });
    }
</script>
</body>
</html>
