<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的文件 - etry</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments :: nav(${user}, 'files')}"></header>

<div class="container">
    <div class="card">
        <div class="row between">
            <h2 style="margin:0">存储空间</h2>
            <span class="muted" id="quotaText"></span>
        </div>
        <div class="quota-bar"><span id="quotaBar"></span></div>
        <div class="muted" style="font-size:12px">回收站里的文件仍然占用空间，彻底删除后才释放</div>
    </div>

    <div class="card">
        <h2>上传文件</h2>
        <div class="dropzone" id="dropzone">
            把文件拖到这里，或
            <button class="small" type="button" id="pickBtn">选择文件</button>
            <div class="muted" style="margin-top:8px;font-size:12px">单文件最大 50MB，文件直接传到对象存储，不经过服务器</div>
        </div>
        <input type="file" id="fileInput" style="display:none">
        <div class="progress-wrap" id="progressWrap">
            <div class="row between">
                <span class="muted" id="progressLabel" style="font-size:12px"></span>
                <button class="ghost small" type="button" id="cancelBtn">取消</button>
            </div>
            <div class="progress"><span id="progressBar"></span></div>
        </div>
    </div>

    <div class="card" id="pendingCard" style="display:none">
        <h2>未完成的上传</h2>
        <table>
            <thead>
            <tr><th>文件名</th><th>大小</th><th>过期时间</th><th style="width:120px">操作</th></tr>
            </thead>
            <tbody id="pendingBody"></tbody>
        </table>
    </div>

    <div class="card">
        <div class="row between wrap" style="margin-bottom:12px">
            <h2 style="margin:0">我的文件</h2>
            <div class="row">
                <input type="search" id="searchInput" placeholder="按文件名搜索" style="width:200px">
                <select id="sortSelect" style="padding:8px;border:1px solid #e3e6ec;border-radius:8px">
                    <option value="created">按上传时间</option>
                    <option value="size">按文件大小</option>
                </select>
            </div>
        </div>
        <table>
            <thead>
            <tr><th>文件名</th><th style="width:90px">大小</th><th style="width:130px">上传时间</th><th style="width:210px">操作</th></tr>
            </thead>
            <tbody id="fileBody"></tbody>
        </table>
        <div class="empty" id="emptyTip" style="display:none">还没有文件，先传一个试试</div>
        <div class="row between" style="margin-top:14px">
            <button class="ghost small" id="prevBtn" type="button">上一页</button>
            <span class="muted" id="pageInfo"></span>
            <button class="ghost small" id="nextBtn" type="button">下一页</button>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/upload.js}"></script>
<script th:inline="javascript">
    const state = {page: 0, size: 20, sort: 'created', keyword: '', total: 0};
    const quotaBytes = /*[[${user.quotaBytes}]]*/ 0;
    let quotaUsed = /*[[${user.usedBytes}]]*/ 0;
    let currentUpload = null;

    function renderQuota() {
        const percent = quotaBytes > 0 ? Math.min((quotaUsed / quotaBytes) * 100, 100) : 0;
        document.getElementById('quotaBar').style.width = percent.toFixed(1) + '%';
        document.getElementById('quotaText').textContent =
            formatSize(quotaUsed) + ' / ' + formatSize(quotaBytes);
    }

    async function loadFiles() {
        const params = new URLSearchParams({
            page: state.page, size: state.size, sort: state.sort
        });
        if (state.keyword) {
            params.set('q', state.keyword);
        }
        const data = await api('/api/files?' + params.toString());
        state.total = data.total;
        const body = document.getElementById('fileBody');
        body.innerHTML = '';
        data.items.forEach(file => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(file.name)}</td>
                <td>${formatSize(file.sizeBytes)}</td>
                <td>${formatTime(file.createdAt)}</td>
                <td>
                    <button class="ghost small" data-action="download" data-id="${file.id}">下载</button>
                    <button class="ghost small" data-action="share" data-id="${file.id}">分享</button>
                    <button class="ghost small" data-action="rename" data-id="${file.id}" data-name="${escapeHtml(file.name)}">改名</button>
                    <button class="ghost small" data-action="delete" data-id="${file.id}">删除</button>
                </td>`;
            body.appendChild(tr);
        });
        document.getElementById('emptyTip').style.display = data.items.length ? 'none' : 'block';
        const totalPages = Math.max(Math.ceil(state.total / state.size), 1);
        document.getElementById('pageInfo').textContent = `第 ${state.page + 1} / ${totalPages} 页，共 ${state.total} 个文件`;
        document.getElementById('prevBtn').disabled = state.page === 0;
        document.getElementById('nextBtn').disabled = state.page + 1 >= totalPages;
    }

    async function loadPending() {
        const items = await api('/api/files/pending');
        const card = document.getElementById('pendingCard');
        const body = document.getElementById('pendingBody');
        body.innerHTML = '';
        if (!items.length) {
            card.style.display = 'none';
            return;
        }
        card.style.display = 'block';
        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(item.name)}</td>
                <td>${formatSize(item.sizeBytes)}</td>
                <td>${formatTime(item.expireAt)}</td>
                <td><button class="ghost small" data-action="cancel-pending" data-id="${item.id}">取消</button></td>`;
            body.appendChild(tr);
        });
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function startUpload(file) {
        const wrap = document.getElementById('progressWrap');
        const bar = document.getElementById('progressBar');
        const label = document.getElementById('progressLabel');
        wrap.style.display = 'block';
        bar.style.width = '0%';
        label.textContent = '正在上传 ' + file.name;
        currentUpload = uploadFile(file, percent => {
            bar.style.width = percent + '%';
            label.textContent = `正在上传 ${file.name} · ${percent}%`;
        });
        currentUpload.then(fileView => {
            toast('上传完成：' + fileView.name);
            quotaUsed += fileView.sizeBytes;
            renderQuota();
            return loadFiles();
        }).catch(error => {
            toast(error.message);
        }).finally(() => {
            wrap.style.display = 'none';
            currentUpload = null;
            loadPending();
        });
    }

    document.getElementById('pickBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', event => {
        const file = event.target.files[0];
        event.target.value = '';
        if (file) {
            startUpload(file);
        }
    });

    const dropzone = document.getElementById('dropzone');
    ['dragenter', 'dragover'].forEach(name => dropzone.addEventListener(name, e => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    }));
    ['dragleave', 'drop'].forEach(name => dropzone.addEventListener(name, e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
    }));
    dropzone.addEventListener('drop', e => {
        const file = e.dataTransfer.files[0];
        if (file) {
            startUpload(file);
        }
    });

    document.getElementById('cancelBtn').addEventListener('click', async () => {
        if (!currentUpload) {
            return;
        }
        toast('上传已取消（未确认的上传会在 30 分钟内自动清理）');
        document.getElementById('progressWrap').style.display = 'none';
        currentUpload = null;
        loadPending();
    });

    document.getElementById('searchInput').addEventListener('input', (() => {
        let timer = null;
        return event => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                state.keyword = event.target.value.trim();
                state.page = 0;
                loadFiles();
            }, 300);
        };
    })());

    document.getElementById('sortSelect').addEventListener('change', event => {
        state.sort = event.target.value;
        state.page = 0;
        loadFiles();
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
        if (state.page > 0) {
            state.page--;
            loadFiles();
        }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
        state.page++;
        loadFiles();
    });

    document.addEventListener('click', async event => {
        const button = event.target.closest('button[data-action]');
        if (!button) {
            return;
        }
        const action = button.dataset.action;
        const id = button.dataset.id;
        try {
            if (action === 'download') {
                const data = await api('/api/files/' + id + '/download-url');
                window.location.href = data.url;
            } else if (action === 'share') {
                const code = prompt('要提取码就输入 4 位数字，留空表示不设提取码：', '');
                if (code === null) {
                    return;
                }
                const share = await api('/api/shares', {
                    method: 'POST',
                    body: JSON.stringify({fileId: Number(id), code: code.trim() || null})
                });
                const link = window.location.origin + share.shareUrl;
                prompt('分享链接（默认 7 天有效，复制后无法阻止他人再下载）：', link);
            } else if (action === 'rename') {
                const name = prompt('新的文件名：', button.dataset.name || '');
                if (name === null) {
                    return;
                }
                await api('/api/files/' + id, {
                    method: 'PATCH',
                    body: JSON.stringify({name: name.trim()})
                });
                toast('已改名');
                loadFiles();
            } else if (action === 'delete') {
                if (!confirm('删除后进入回收站，14 天后才会彻底删除，期间仍占用空间。确认删除？')) {
                    return;
                }
                await api('/api/files/' + id, {method: 'DELETE'});
                toast('已移入回收站');
                loadFiles();
                loadPending();
            } else if (action === 'cancel-pending') {
                await api('/api/files/' + id + '/pending', {method: 'DELETE'});
                toast('已取消上传');
                loadPending();
            }
        } catch (error) {
            toast(error.message);
        }
    });

    bindLogout();
    renderQuota();
    loadFiles().catch(error => toast(error.message));
    loadPending().catch(() => {
    });
</script>
</body>
</html>
