spring:
  datasource:
    url: ${ETRY_DB_URL:jdbc:mysql://127.0.0.1:3306/etry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${ETRY_DB_USER}
    password: ${ETRY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${ETRY_REDIS_HOST:127.0.0.1}
      port: ${ETRY_REDIS_PORT:6379}
      password: ${ETRY_REDIS_PASSWORD:}

etry:
  storage:
    type: cos
  mail:
    type: smtp
  cache:
    type: redis

logging:
  level:
    com.wherelee.etry: INFO
  file:
    name: /opt/etry/logs/etry.log
