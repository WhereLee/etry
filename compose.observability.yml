# Optional observability stack. Start explicitly:
#   docker compose -f compose.yml -f compose.server.yml -f compose.observability.yml --profile observability up -d
# It binds only to loopback and is not part of the default application stack.

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-320m}
    restart: unless-stopped
    depends_on:
      - alertmanager
    profiles: ["observability"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093"
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-64m}
    restart: unless-stopped
    profiles: ["observability"]

  alert-sink:
    image: python:3.12-alpine
    command: ["python", "/app/sink.py"]
    volumes:
      - ./observability/alert-sink/sink.py:/app/sink.py:ro
    mem_limit: ${ALERT_SINK_MEM_LIMIT:-32m}
    restart: unless-stopped
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.docker}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["observability"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_PORT:-14318}:4318"
    mem_limit: ${JAEGER_MEM_LIMIT:-192m}
    restart: "no"
    profiles: ["observability"]

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
