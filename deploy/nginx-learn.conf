# btry 课程演示：/learn/ 前端 + /api/ 后端
# 由 deploy-prod.ps1 安装到 /etc/nginx/snippets/btry-learn.conf，
# 并在 whereri.site 的 443 server 块里 include。

location = /learn {
    return 301 /learn/;
}

# Vue SPA，构建 base=/learn/。真实文件直接返回，其余交给 index.html。
# 这里的 add_header 会覆盖 server 级继承，所以安全头必须整套重写；
# CSP 相比个人站多放开 COS 的 media/connect，否则视频播不了。
location /learn/ {
    try_files $uri $uri/ /learn/index.html;
    expires -1;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://*.myqcloud.com blob:; connect-src 'self' https://*.myqcloud.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

# 后端 API。X-Forwarded-For 用 $remote_addr 覆盖而不是追加，
# 因为后端 TRUST_FORWARDED_HEADERS=true，追加会让客户端伪造 IP 绕过登录限流。
location /api/ {
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 20m;
}
