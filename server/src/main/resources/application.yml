server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: btry-learning-space
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/btry_edu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5175,http://localhost:5175}
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    login-protection-enabled: ${LOGIN_PROTECTION_ENABLED:true}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:8}
    login-ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:40}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET:etry-btry-demo-jwt-secret-change-before-production-2026}
    ttl-minutes: ${JWT_TTL_MINUTES:10080}
  cos:
    bucket: ${COS_BUCKET:rag-1325750042}
    region: ${COS_REGION:ap-shanghai}
    url-ttl-minutes: ${COS_URL_TTL_MINUTES:240}
    connect-timeout-ms: ${COS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${COS_READ_TIMEOUT_MS:15000}
    max-retries: ${COS_MAX_RETRIES:2}
  playback:
    url-cache-margin-minutes: ${PLAYBACK_URL_CACHE_MARGIN_MINUTES:30}
    log-retention-days: ${PLAYBACK_LOG_RETENTION_DAYS:30}
  demo:
    video-key: ${SAMPLE_VIDEO_KEY:edu/video/91/demo-real-181s-faststart-cache.mp4}
    video-duration-seconds: ${SAMPLE_VIDEO_DURATION_SECONDS:181}
  alert:
    enabled: ${ALERT_ENABLED:true}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    window-minutes: ${ALERT_WINDOW_MINUTES:10}
    error-threshold: ${ALERT_ERROR_THRESHOLD:5}
    stall-threshold: ${ALERT_STALL_THRESHOLD:10}
    cache-miss-rate-threshold: ${ALERT_CACHE_MISS_RATE_THRESHOLD:0.8}
    min-cache-requests: ${ALERT_MIN_CACHE_REQUESTS:20}
    dedup-minutes: ${ALERT_DEDUP_MINUTES:30}
    evaluate-interval-ms: ${ALERT_EVALUATE_INTERVAL_MS:300000}
    initial-delay-ms: ${ALERT_INITIAL_DELAY_MS:60000}
  teacher-invitation:
    base-url: ${APP_BASE_URL:http://127.0.0.1:5175}
    expiry-hours: ${TEACHER_INVITE_EXPIRY_HOURS:72}
    max-attempts: ${TEACHER_INVITE_MAX_ATTEMPTS:20}
    window-minutes: ${TEACHER_INVITE_WINDOW_MINUTES:10}
  upload:
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:4294967296}
    url-ttl-minutes: ${UPLOAD_URL_TTL_MINUTES:60}
    allowed-content-types: ${UPLOAD_ALLOWED_CONTENT_TYPES:video/mp4,video/webm}
  seed:
    # 首次启动创建演示账号的初始密码。留空则随机生成并在启动日志打印一次，
    # 三个账号都强制首次改密。不要把固定口令写进仓库。
    admin-password: ${SEED_ADMIN_PASSWORD:}
    teacher-password: ${SEED_TEACHER_PASSWORD:}
    student-password: ${SEED_STUDENT_PASSWORD:}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:true}
    mock-secret: ${PAYMENT_MOCK_SECRET:btry-mock-payment-secret-change-before-production}
    order-expire-minutes: ${PAYMENT_ORDER_EXPIRE_MINUTES:15}
    query-after-seconds: ${PAYMENT_QUERY_AFTER_SECONDS:15}
    reconcile-batch-size: ${PAYMENT_RECONCILE_BATCH_SIZE:20}
    reconcile-interval-ms: ${PAYMENT_RECONCILE_INTERVAL_MS:15000}
    reconcile-initial-delay-ms: ${PAYMENT_RECONCILE_INITIAL_DELAY_MS:10000}
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      seller-id: ${ALIPAY_SELLER_ID:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
      charset: ${ALIPAY_CHARSET:UTF-8}
      sign-type: ${ALIPAY_SIGN_TYPE:RSA2}
      format: ${ALIPAY_FORMAT:json}
      connect-timeout-ms: ${ALIPAY_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ALIPAY_READ_TIMEOUT_MS:15000}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db,ping,readinessState
        liveness:
          include: livenessState,ping
  metrics:
    tags:
      application: btry-learning-space

resilience4j:
  circuitbreaker:
    instances:
      redis:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      playbackLogDb:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      playbackLogDb:
        maxAttempts: 2
        waitDuration: 100ms

logging:
  file:
    name: ${LOG_FILE:logs/btry.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
  level:
    com.wherelee.edu: info
