server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: trade-center
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trade_center?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${TRADE_REDIS_HOST:127.0.0.1}
      port: ${TRADE_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

app:
  jwt:
    # 开发用固定密钥，生产必须走环境变量覆盖，长度不少于 32 字节
    secret: ${TRADE_JWT_SECRET:trade-center-dev-only-secret-key-change-in-prod-2026}
    ttl-minutes: 120
  order:
    # 待支付订单的有效期，单位分钟
    expire-minutes: 10

logging:
  level:
    com.wherelee.trade: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
