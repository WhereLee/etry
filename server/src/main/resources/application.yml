server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: edu
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/edu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      # 头像上限 2MB：超过这个尺寸的头像在页面上已经没意义了，不如压一压再传
      max-file-size: 2MB
      max-request-size: 3MB

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

app:
  storage:
    # cos：文件直接进对象存储，服务器不落盘（默认）
    # local：存本机磁盘，仅用于没配 COS 密钥的本地调试
    type: ${STORAGE_TYPE:cos}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    cos:
      bucket: ${COS_BUCKET:rag-1325750042}
      region: ${COS_REGION:ap-shanghai}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      key-prefix: ${COS_KEY_PREFIX:edu/}
      # 头像等私有对象靠预签名访问，过期后前端重新拉接口即可拿到新链接
      url-ttl-minutes: ${COS_URL_TTL_MINUTES:120}
  jwt:
    # 不提供默认值：未注入 JWT_SECRET 时启动失败。
    # 用 ${JWT_SECRET:} 而不是 ${JWT_SECRET}：后者解析不到时会把字面量塞进来，
    # 报出来的是「长度不足」，而不是「没配置」。
    secret: ${JWT_SECRET:}
    ttl-minutes: 120
  security:
    # 连续登录失败达到阈值后锁定，窗口内不再校验密码
    login-fail-threshold: 5
    # 锁定时长，同时也是失败计数在 Redis 里的存活时间（一个数说清一件事）
    login-lock-minutes: 15
    # 同一 IP 累计失败到这个数就整个 IP 锁一段时间：
    # 只按账号计数的话，攻击者可以换用户名无限猜
    ip-fail-threshold: 30
    ip-lock-minutes: 60
    # X-Forwarded-For 是客户端可伪造的请求头。只有部署在反向代理后面才能信，
    # 否则审计里的来源 IP 等于随便填。
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}

  # 学习进度判定策略
  learning:
    # 开：完成 = 位置到 90% 且从第一次上报到现在真实过了 90% 的课时时长。
    #     「一次请求直接报到底」这种刷法刷不出完成，但拖到结尾的人也要等够时间才能标完成。
    # 关（默认）：只看位置。免费课没有证书和积分，刷进度的收益本来就低。
    strict-mode: ${LEARNING_STRICT_MODE:false}

  auth:
    # 注册时用户名被占用，是否明说「已存在」。
    # 关（默认）统一回「该用户名暂不可用」，避免注册接口变成账号枚举工具。
    reveal-username-conflict: ${REVEAL_USERNAME_CONFLICT:false}

# 接口文档：/swagger-ui.html 看页面，/v3/api-docs 拿 JSON。
# 生产上设 API_DOCS_ENABLED=false 关掉
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

logging:
  level:
    # 默认 info：debug 会把 Mapper 参数原样写进日志，
    # 包括 password_hash、重置后的临时密码。本地要看 SQL 再开环境变量。
    com.wherelee.edu: ${APP_LOG_LEVEL:info}
    com.wherelee.edu.mapper: ${MAPPER_LOG_LEVEL:info}

# 运维端点单独走 9090 并只监听本机：
# 挂到业务端口上会让 /actuator/** 跟着对外暴露，metrics 里有 JVM 和连接池细节。
# 生产上通过 SSH 隧道或只允许内网访问。
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 只监听了本机，所以允许详情，方便直接看出是 DB 挂了还是 Redis 挂了
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: db,redis
